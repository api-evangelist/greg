aid: greg
name: Greg
description: 'Greg is a consumer mobile application for plant identification and care,
  available on iOS and Android. Users photograph a plant to identify it in seconds and
  receive smart, personalized care guidance — watering schedules, light and soil
  recommendations, and reminders — alongside a community of plant enthusiasts, care
  articles, and a plant directory. Greg is an Index Ventures portfolio company in the
  AI/ML space, applying computer-vision plant recognition. It is a consumer app and does
  not currently publish a developer API, SDK, or developer portal.'
